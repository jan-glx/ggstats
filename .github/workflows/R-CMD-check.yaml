# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
   
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }}, ggplot${{ matrix.config.ggplot }})

    strategy:
      fail-fast: false
      matrix:
        config:
          # current ecosystem
          - {os: macos-latest,   r: 'release', ggplot: '', snapshot: ''}
          - {os: windows-latest, r: 'release', ggplot: '', snapshot: ''}
          - {os: ubuntu-latest,  r: 'devel',   ggplot: '', snapshot: ''}
          - {os: ubuntu-latest,  r: 'release', ggplot: '', snapshot: ''}
          - {os: ubuntu-latest,  r: 'oldrel-1', ggplot: '', snapshot: ''}

          # minimum supported ggplot test
          - {os: ubuntu-latest, r: '4.3', ggplot: '@3.4.0', snapshot: '2023-03-01'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      # override RSPM to force historical CRAN snapshot
      - name: Use CRAN snapshot
        if: matrix.config.snapshot != ''
        run: |
          echo "RSPM=https://packagemanager.posit.co/cran/${{ matrix.config.snapshot }}" >> $GITHUB_ENV
          echo "RENV_CONFIG_REPOS_OVERRIDE=https://packagemanager.posit.co/cran/${{ matrix.config.snapshot }}" >> $GITHUB_ENV

      # debug step (optional but useful while tuning CI)
      - name: Show repo configuration
        run: |
          echo "RSPM=$RSPM"
          Rscript -e 'print(getOption("repos"))'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            ggplot2${{ matrix.config.ggplot }}
          needs: check
          lockfile: false

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
